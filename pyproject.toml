[project]
name = "cocli"
dynamic = ["version"]
description = "A CLI for managing a plain-text CRM."
authors = [{ name = "Mark Stouffer", email = "mark@getbizkite.com" }]
requires-python = ">=3.9"
dependencies = [
    "typer",
    "pydantic",
    "rich",
    "requests",
    "chardet>=3.0.2,<6.0.0",  # Version constraint for requests compatibility
    "beautifulsoup4",
    "pyyaml",
    "lxml",
    "playwright~=1.55.0",
    "html5lib",
    "lxml_html_clean",
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "boto3",
    "simple-term-menu",
    "jmespath",
    "appdirs",
    "tomli",
    "tomli_w",
    "email-validator",
    "toml",
    "geopy",
    "dateparser",
    "httpx",
    "transitions",
    "fuzzywuzzy",
    "python-Levenshtein",
    "simplekml",
    "python-dateutil",
    "psutil",
    "aiohttp>=3.13.3",
    "selectolax>=0.4.6",
    "duckdb",
    "zeroconf>=0.148.0",
    "watchdog>=6.0.0",
    "wasmtime>=29.0.0",
    "pillow",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "phonenumbers",
    # stations: typed file-path queue/WAL/index Protocols (strangler Phase 1).
    # Not a cocli workspace member (stations decision 0005).
    "stations",
]

[tool.uv.sources]
# Canonical HTTPS source — resolves identically from any checkout depth, Docker,
# and CI (a relative path dep only resolved from .gwt/* worktrees and broke image
# builds). For local hacking on stations/python, temporarily switch to a path
# source; do not commit the override. Bump the pinned rev with:
#   uv lock --upgrade-package stations
stations = { git = "https://github.com/bizkite-co/stations", subdirectory = "python" }

[project.scripts]
cocli = "cocli.main:app"
cocli-worker = "cocli.worker_main:app"

[project.optional-dependencies]
video = [
    "google-genai",
    "faster-whisper",
    "ctranslate2",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-nvrtc-cu12",
]
op = [
    "onepassword-sdk",
    "keyring",
    "keyrings.alt",
]
worker = []
full = [
    "pandas",
    "textual>=6.4.0",
    "textual-image>=0.12.0",
    "google-genai",
    "faster-whisper",
    "ctranslate2",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "onepassword-sdk",
    "keyring",
    "keyrings.alt",
]
dev = [
    "pytest",
    "pytest-env",
    "pytest-mock",
    "pytest-asyncio",
    "pytest-playwright",
    "pytest-bdd",
    "behave",
    "build",
    "mypy",
    "types-toml",
    "types-PyYAML",
    "types-requests",
    "pandas-stubs",
    "types-dateparser",
    "types-pytz",
    "types-psutil",
    "ruff",
    "boto3-stubs[s3,sqs]",
    "watchdog",
    "import-linter",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["cocli*"]
exclude = [
    "data*", 
    "cocli_data*",
    "cocli_share*",
    "homepage*",
    "logs*",
    "turboship*",
    "quickbooks-search*",
    "tests*", 
    "scripts*", 
    "build*", 
    "dist*", 
    "temp*", 
    ".logs*", 
    ".venv*", 
    ".mypy_cache*", 
    ".pytest_cache*", 
    ".ruff_cache*",
    "cocli.egg-info*",
    "cdk_scraper_deployment*"
]

[tool.setuptools.package-data]
cocli = ["utils/*.js"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.uv]
package = true

[tool.mypy]
strict = true
ignore_missing_imports = false
mypy_path = "$MYPY_PATH"
exclude = [
    ".venv",
    "build",
    "dist",
    "docs",
    "features",
    "tests",
    "backup",
    "data",
    "cocli.egg-info",
    "data",
    "cdk_scraper_deployment",
    "turboship",
    "cdk.out",
    "quickbooks-search",
    "mutt-setup",
    "fullertonian-site",
    "scripts",
    "video-automation",
    "tools",
]
follow_imports = "normal"

[tool.ruff]
exclude = [
    "mutt-setup",
    ".venv",
    "data",
    "build",
    "dist",
    "fullertonian-site",
    "video-automation",
]
[tool.ruff.lint]
ignore = ["E402"]
extend-select = ["TRY002"]  # raise Exception(...) directly - always create/use a specific exception
[tool.ruff.lint.per-file-ignores]
"cocli/main.py" = ["E402"]

[dependency-groups]
dev = [
    "frictionless>=5.18.1",
]

[[tool.mypy.overrides]]
module = "cocli.core.website_cache"
disable_error_code = ["call-overload"]

[[tool.mypy.overrides]]
module = "cocli.tui.campaign_app"
disable_error_code = ["func-returns-value"]

[[tool.mypy.overrides]]
module = "cocli.tui.widgets.company_detail"
disable_error_code = ["func-returns-value"]

[[tool.mypy.overrides]]
module = "scripts"
ignore_errors = true

[tool.importlinter]
root_package = "cocli"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Commands are leaf nodes"
type = "forbidden"
source_modules = [
    "cocli.application",
    "cocli.core",
    "cocli.models",
    "cocli.scrapers",
    "cocli.tui",
]
forbidden_modules = [
    "cocli.commands",
]
ignore_imports = [
    # Burn-down targets: Refactor these commands to delegate to canonical application services
    "cocli.core.campaign_workflow -> cocli.commands.campaign.prospecting",
    "cocli.core.campaign_workflow -> cocli.commands.import_companies",
    "cocli.core.campaign_workflow -> cocli.commands.ingest_google_maps_csv",
]

[[tool.importlinter.contracts]]
name = "Core and models import no higher layer"
type = "forbidden"
source_modules = [
    "cocli.core",
    "cocli.models",
]
forbidden_modules = [
    "cocli.application",
    "cocli.services",
    "cocli.commands",
    "cocli.tui",
]
ignore_imports = [
    # Burn-down targets: Extract workflow actions to application services to avoid core calling commands
    "cocli.core.campaign_workflow -> cocli.commands.campaign.prospecting",
    "cocli.core.campaign_workflow -> cocli.commands.import_companies",
    "cocli.core.campaign_workflow -> cocli.commands.ingest_google_maps_csv",
]

[[tool.importlinter.contracts]]
name = "Scrapers import no commands or TUI"
type = "forbidden"
source_modules = [
    "cocli.scrapers",
]
forbidden_modules = [
    "cocli.commands",
    "cocli.tui",
]
ignore_imports = [
    # Burn-down target: Inject 1Password credentials from caller instead of scraper fetching from ServiceContainer
    "cocli.scrapers.event_search_scraper -> cocli.application.services",
]

[[tool.importlinter.contracts]]
name = "TUI imports application services, not commands"
type = "forbidden"
source_modules = [
    "cocli.tui",
]
forbidden_modules = [
    "cocli.commands",
]

